name: Build

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"
  COMPILE_SDK: "37"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=10g -Dfile.encoding=UTF-8"

jobs:
  build:
    name: Compilar TwedMediaInfo
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Instalar plataforma Android, NDK y CMake
        run: |
          set -euo pipefail

          SDKMANAGER_BIN="$(command -v sdkmanager || true)"

          if [ -z "${SDKMANAGER_BIN}" ]; then
            for candidate in \
              "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
              "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"; do
              if [ -x "${candidate}" ]; then
                SDKMANAGER_BIN="${candidate}"
                break
              fi
            done
          fi

          if [ -z "${SDKMANAGER_BIN}" ]; then
            echo "No se encontró sdkmanager en el PATH ni en ANDROID_HOME/ANDROID_SDK_ROOT."
            exit 1
          fi

          echo "Usando sdkmanager: ${SDKMANAGER_BIN}"

          yes | "${SDKMANAGER_BIN}" --licenses > /dev/null 2>&1 || true

          "${SDKMANAGER_BIN}" --install \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Preparar local.properties y ANDROID_NDK_HOME
        run: |
          set -euo pipefail

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "${SDK_DIR}" ]; then
            echo "No se encontró ANDROID_HOME ni ANDROID_SDK_ROOT."
            exit 1
          fi

          echo "sdk.dir=${SDK_DIR}" > local.properties

          echo "ANDROID_NDK_HOME=${SDK_DIR}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Verificar toolchain y third_party
        run: |
          set -euo pipefail

          java -version

          if [ ! -d "${ANDROID_NDK_HOME}" ]; then
            echo "No existe el NDK esperado en ${ANDROID_NDK_HOME}"
            exit 1
          fi

          if [ -x "${ANDROID_NDK_HOME}/ndk-build" ]; then
            "${ANDROID_NDK_HOME}/ndk-build" --version || true
          else
            echo "WARN: ndk-build no encontrado en ${ANDROID_NDK_HOME}"
          fi

          for required_dir in \
            third_party/MediaInfoLib-26.05/Source \
            third_party/ZenLib-0.4.41/Source \
            third_party/zlib-1.3.2; do
            if [ ! -d "${required_dir}" ]; then
              echo "Falta la carpeta ${required_dir}."
              echo "Asegúrate de tener third_party dentro del repositorio o como submódulos."
              exit 1
            fi
          done

      - name: Dar permisos al wrapper de Gradle
        run: |
          chmod +x ./gradlew || true

      - name: Compilar AAR Debug y Release
        run: |
          ./gradlew :lib:assembleDebug :lib:assembleRelease --stacktrace --no-daemon

      - name: Publicar AAR en Maven Local
        run: |
          ./gradlew :lib:publishToMavenLocal --stacktrace --no-daemon

      - name: Verificar publicación en Maven Local
        run: |
          set -euo pipefail
          
          MAVEN_LOCAL="${HOME}/.m2/repository/com/twedmediainfo/twedmediainfo/0.1.0-SNAPSHOT"
          
          if [ ! -d "${MAVEN_LOCAL}" ]; then
            echo "ERROR: No se encontró el directorio de Maven Local: ${MAVEN_LOCAL}"
            echo "Contenido de ~/.m2/repository:"
            find "${HOME}/.m2/repository" -type d -maxdepth 4 || true
            exit 1
          fi
          
          echo "✅ AAR publicado correctamente en Maven Local"
          echo "Contenido de ${MAVEN_LOCAL}:"
          ls -lah "${MAVEN_LOCAL}"

      - name: Subir AAR como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twedmediainfo-aar
          path: lib/build/outputs/aar/*.aar
          if-no-files-found: warn